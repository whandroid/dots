# ~/.tmux.conf — tmux 3.4
# Reload with:  prefix r      (prefix is C-a)

# ---------- Prefix ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix              # C-a C-a sends a literal C-a to the app (e.g. shell line start)
bind a last-window                # C-a a toggles to the previous window

# ---------- General ----------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,*256col*:Tc"   # true color passthrough
set -s escape-time 10             # No delay after Esc (important for Vim)
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5
set -g focus-events on            # Lets Vim's autoread notice external changes
set -g mouse on
set -g base-index 1               # Windows start at 1 (matches keyboard row)
setw -g pane-base-index 1
set -g renumber-windows on        # Close a window and the rest renumber
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S:#I #W"
setw -g mode-keys vi              # Vi keys in copy mode
set -g status-keys emacs          # Emacs keys in the command prompt (easier there)
setw -g aggressive-resize on
set -g allow-passthrough on

# ---------- Reload ----------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---------- Windows ----------
bind c new-window -c "#{pane_current_path}"
bind -r C-n next-window
bind -r C-p previous-window
bind -r Tab last-window
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1
bind , command-prompt -I "#W" "rename-window '%%'"
# Alt+number switches windows without the prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ---------- Panes ----------
# Split, opening in the current directory. | vertical, - horizontal
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -fh -c "#{pane_current_path}"   # full-height split
bind _  split-window -fv -c "#{pane_current_path}"   # full-width split
# Vim-style pane navigation with the prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Alt+hjkl navigates panes without the prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Resize (repeatable: hold prefix then tap repeatedly)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z             # Toggle zoom (maximize) pane
bind x kill-pane                  # No confirmation prompt
bind X kill-window
bind b break-pane                 # Move pane to its own window
bind S choose-tree -Zs            # Session / window picker
bind s command-prompt -p "join pane from window:" "join-pane -s '%%'"
bind -r Space next-layout
bind = select-layout tiled

# ---------- Copy mode (vi) ----------
bind Enter copy-mode
bind Escape copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi Y   send -X copy-line
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind p paste-buffer
bind P choose-buffer
# Mouse drag copies without leaving copy mode / jumping to bottom
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
# Use the terminal's OSC 52 clipboard when available (works over SSH in many terminals)
set -g set-clipboard on
# If xclip / wl-copy is installed, also pipe to the system clipboard
if-shell "command -v wl-copy" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'"
if-shell "command -v xclip" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# ---------- Status bar ----------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1c1c1c,fg=#bcbcbc"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bg=#5f87af,fg=#1c1c1c,bold] #S #[bg=#1c1c1c,fg=#5f87af]#{?client_prefix,#[bg=#d7af5f] C-a ,} "
set -g status-right "#[fg=#8a8a8a]#{?window_zoomed_flag,[ZOOM] ,}#(whoami)@#h #[fg=#bcbcbc]%Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format "#[bg=#5f87af,fg=#1c1c1c,bold] #I:#W#F "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#d7af5f"
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#5f87af"
set -g message-style "bg=#d7af5f,fg=#1c1c1c,bold"
set -g mode-style "bg=#5f87af,fg=#1c1c1c"
setw -g monitor-activity on
set -g visual-activity off

# ---------- Misc ----------
bind C-l send-keys "C-l"          # prefix C-l clears the screen (C-l alone is pane nav in Vim splits)
bind / command-prompt -p "man:" "split-window -h 'exec man %%'"
bind e new-window -n vimrc "vim ~/.vimrc"
bind E new-window -n tmux.conf "vim ~/.tmux.conf"
